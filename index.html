<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
    <meta name="theme-color" content="#0E4B2E">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Team Flow">
    <meta name="description" content="Create fair pickleball court assignments, player rotations, and doubles matchups across multiple courts and rounds.">
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" href="./icon-192.png">
    <link rel="apple-touch-icon" href="./icon-192.png">
    <title>Pickleball Team Flow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <style>
    html,
    body,
    #app {
        width: 100%;
        min-height: 100%;
    }

    body {
        font-family: Arial, sans-serif;
        margin: 0;
        background-color: #f5f5f5;

        padding-top: env(safe-area-inset-top);
        padding-right: env(safe-area-inset-right);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
    }

    #app {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
    }

    @media (max-width: 575.98px) {
        #app {
            padding: 12px;
        }
    }

    .group h4 {
        margin: 0 0 10px 0;
        font-size: 16px;
    }

    .group.regular h4 {
        color: #1976d2;
    }

    .group.bye h4 {
    color: #f57c00;
}

.group ul {
    margin: 0;
    padding-left: 20px;
}

.group li {
    margin-bottom: 5px;
}

.results {
    margin-bottom: 30px;
    padding: 20px;
    border: 2px solid #e9ecef;
    border-radius: 8px;
    background: #fff;
}

.round-header h3::after {
    content: " ✓";
    color: #28a745;
    font-weight: bold;
    display: none;
}

.round-header.closed h3::after {
    display: inline;
}

.btn-close-round {
    font-size: 0.875rem;
}

</style>
</head>
<body>
    
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
    <script>
        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
                    .then(registration => {
                        console.log('Service Worker registered:', registration.scope);
                    })
                    .catch(error => {
                        console.log('Service Worker registration failed:', error);
                    });
            });
        }
    </script>
</body>
</html>
